name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: markhobson/maven-chrome:3.8.6-jdk-8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build
        run: mvn --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true compile

  smokesuite:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: markhobson/maven-chrome:3.8.6-jdk-8
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke suite (qa)
        run: mvn --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true test -Dsuite=smoke -Denvironment=qa

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: smoke-reports
          path: |
            target/surefire-reports/index.html
            src/test/resources/PageScreenShots

  regressionsuite:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: markhobson/maven-chrome:3.8.6-jdk-8
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run regression suite (qa)
        run: mvn --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true test -Dsuite=regression -Denvironment=qa

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: regression-reports
          path: |
            target/surefire-reports/index.html
            src/test/resources/PageScreenShots
