variables:
  MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

image: markhobson/maven-chrome:jdk-11

stages:
  - build
  - smoke check
  - regression check

cache:
  paths:
    - .m2/repository/
    - target/

build:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS compile
  artifacts:
    paths:
      - build/

smoke:
  stage: smoke check
  script:
    - mvn $MAVEN_CLI_OPTS test -Dsuite=smoke -Denvironment=qa
  allow_failure: false
  artifacts:
    when: always
    paths:
      - "target/surefire-reports/*"
      - "*/target/surefire-reports/*"
      - "*/*/target/surefire-reports/*"
      - "src/test/resources/test-output/*"

regression:
  stage: regression check
  script:
    - mvn $MAVEN_CLI_OPTS test -Dsuite=regression -Denvironment=qa
  allow_failure: false
  artifacts:
    when: always
    paths:
      - "target/surefire-reports/*"
      - "*/target/surefire-reports/*"
      - "*/*/target/surefire-reports/*"