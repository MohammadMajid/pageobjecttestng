image: markhobson/maven-firefox

stages:
  - build
  - smoke check

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository/
    - target/

build:
  stage: build
  script:
    - mvn compile

smoketest:
  stage: smoke check
  script:
    - mvn test -Dsuite=smoke -Denvironment=qa

regressiontest:
  stage: smoke check
  script:
    - mvn test -Dsuite=regression -Denvironment=qa

